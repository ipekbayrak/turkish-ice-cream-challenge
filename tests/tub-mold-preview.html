<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kalıp ve boş kova kontrolü</title><style>body{margin:0;background:#160b06;color:#fff3d8;font:12px system-ui}canvas{position:fixed;inset:0;width:100%;height:100%}aside{position:fixed;bottom:8px;left:8px;right:8px;background:#21150fee;padding:9px;border-radius:12px;display:flex;gap:5px;flex-wrap:wrap}button,select{font:inherit;padding:8px}output{display:block;width:100%;overflow-wrap:anywhere}</style><canvas></canvas><aside><select aria-label="Numara"><option>WHOLE_MOLD_ON_CONE</option><option>GIANT_BLOCK_TEASE</option><option>MIDAIR_BLOCK_SOMERSAULT</option><option>CUSTOMER_MOLD_MOUNT</option></select><select aria-label="Lezzet"><option value="0">Sade</option><option value="1">Fıstıklı</option><option selected value="2">Kakaolu</option><option value="3">Dutlu</option></select><button id="play">Başlat</button><button id="out">Çıkarılmış halde</button><button id="back">Yerine koy</button><button id="pause">Durdur</button><output></output></aside>
<script type="module">
import * as THREE from 'three';import{GameWorld}from'/src/world.js';import{TrickDirector}from'/src/tricks.js';import{EncounterCamera}from'/src/encounter-camera.js';
const V=(x=0,y=0,z=0)=>new THREE.Vector3(x,y,z),noop=()=>{};
const w=new GameWorld(document.querySelector('canvas')),cam=new EncounterCamera(w);w.encounterCamera=cam;cam.setPhase('play',true);
const save={lang:'tr',data:{unlockedStage:31,preferredScoopCount:2,preferredFlavors:[2,2]},hapticsEnabled:false,t:k=>k,discoverTrick:noop,setOrderPreferences:noop,recordStageResult:noop,getStageBestScore:()=>0,getUstaName:()=>'',getTrickInfo:id=>({name:id})};
const sound=new Proxy({},{get:()=>noop}),d=new TrickDirector(w,sound,save,{onRoundEnd:noop});let time=0,last=performance.now(),running=false,id='',flavor=2,firstModel=null;
const input={isPointerDown:true,isReaching:false,isMoving:false,normX:-1,normY:-1,handWorldPos:V(.04,1.2,.26),intentWorldPos:V(-3,-3,3),pointerEpoch:1,cancelEpoch:0};
function reset(){id=document.querySelector('[aria-label="Numara"]').value;flavor=Number(document.querySelector('[aria-label="Lezzet"]').value);d.setOrderConfig(2,[flavor,flavor],31);d.resetRound(31,false);d.scoopCount=id==='CUSTOMER_MOLD_MOUNT'?0:2;w.updateIceCreamScoops(d.scoopCount);w.updateServingLayout(1);if(id==='CUSTOMER_MOLD_MOUNT'){w.handoffCone('player');w.stallEffects.update(1);}d.routine=[id,'FINAL_PISTACHIO_CATCH'];d.active=true;d.roundEnded=false;d._enterRoutineStep(0);time=0;firstModel=null;running=false;input.handWorldPos.set(id==='CUSTOMER_MOLD_MOUNT'?.04:.3,id==='CUSTOMER_MOLD_MOUNT'?1.2:1.0,id==='CUSTOMER_MOLD_MOUNT'?.26:.42);}
function tick(dt){time+=dt;w.updateTouristHand(input.handWorldPos,.2,0,dt,false,time);d.update(dt,time,input);w.updateEnvironmentAnimations(time,dt);cam.update(dt);if(w.tubMoldTransfer?.active)firstModel ||= w.tubMoldTransfer.active.model.uuid;}
function out(){reset();for(let i=0;i<900;i++){tick(1/120);const ready=id==='CUSTOMER_MOLD_MOUNT'?d.subStep===3&&d.stageTimer>.2:id==='WHOLE_MOLD_ON_CONE'?d.stageTimer>1.45:id==='GIANT_BLOCK_TEASE'?d.stageTimer>1.05:d.stageTimer>.8;if(ready&&w.tubMoldTransfer?.active)break;}}
function back(){let seen=Boolean(w.tubMoldTransfer?.active);for(let i=0;i<1200;i++){tick(1/120);if(w.tubMoldTransfer?.active)seen=true;if(seen&&!w.tubMoldTransfer?.active)break;}running=false;}
document.querySelector('#play').onclick=()=>{reset();running=true;};document.querySelector('#out').onclick=out;document.querySelector('#back').onclick=back;document.querySelector('#pause').onclick=()=>running=!running;
for(const s of document.querySelectorAll('select'))s.onchange=out;
reset();
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.033,(now-last)/1000);last=now;if(running){tick(dt);if(firstModel&&!w.tubMoldTransfer?.active)running=false;}w.render();const t=w.tubIceGroups[flavor],e=w.tubMoldTransfer?.entries.get(flavor);document.querySelector('output').textContent=JSON.stringify({mechanic:id,phase:d.subStep,fill:t.fill,empty:t.moldOut??false,tubVisible:t.group.visible,owner:e?.model.parent===t.group?'bucket':e?.model.parent===w.giantBlockGroup?'carrier':'original',sameModel:Boolean(e&&e.model.uuid===firstModel),model:e?.model.uuid,originalVisible:e?.original.some(o=>o.visible)});}
requestAnimationFrame(frame);
</script></html>
