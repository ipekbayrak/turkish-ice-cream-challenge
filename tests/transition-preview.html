<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Numaralar arası doğal geçiş — kontrol</title>
<style>body{margin:0;background:#140805;color:#ffedcd;font:12px system-ui}canvas{position:fixed;inset:0}aside{position:fixed;bottom:10px;left:10px;right:10px;background:#20160ff0;padding:10px;border-radius:12px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}button,select{padding:8px;font:inherit}output{width:100%;white-space:pre-wrap}[hidden]{display:none!important}</style>
<canvas></canvas><aside><select aria-label="Sonraki numara"></select><button id="go">Bu pozdan geç</button><button id="pause">Durdur</button><button id="play">Oynat</button><button id="paper">Peçeteyi göster</button><button id="hide">Gizle</button><output></output></aside>
<script type="module">
import * as THREE from 'three';import{GameWorld}from'/src/world.js';import{TrickDirector,TRICK_CATALOG}from'/src/tricks.js';import{isChoreographedRoutine}from'/src/trick-routines.js';import{SoundEngine}from'/src/audio.js';import{paperReturnHandTarget}from'/src/napkin-return.js';import{EncounterCamera}from'/src/encounter-camera.js';
const V=(x=0,y=0,z=0)=>new THREE.Vector3(x,y,z),noop=()=>{};
const w=new GameWorld(document.querySelector('canvas')),sound=new SoundEngine();sound.setMuted(true);
const save={lang:'tr',data:{unlockedStage:31,preferredScoopCount:2,preferredFlavors:[0,2,1,3]},hapticsEnabled:false,t:k=>k,discoverTrick:noop,setOrderPreferences:noop,recordStageResult:noop,getStageBestScore:()=>0,getUstaName:()=>'',getTrickInfo:id=>({name:id})};
const d=new TrickDirector(w,sound,save,{onRoundEnd:noop}),cam=new EncounterCamera(w);w.encounterCamera=cam;cam.setPhase('play',true);
const input={isPointerDown:false,isReaching:false,isMoving:false,normX:0,normY:-1,handWorldPos:V(.22,1.04,.64),intentWorldPos:V(.22,1.04,.64),pointerEpoch:0,cancelEpoch:0};
let time=0,last=performance.now(),running=true,maxStep=0,prior=V(),started='',joins=0,previousJoin=null;
const select=document.querySelector('select');for(const trick of TRICK_CATALOG.filter(t=>!isChoreographedRoutine(t.id))){const o=new Option(trick.names?.tr||trick.id,trick.id);select.add(o);}
function go(){const id=select.value;d.routine=[id,'FINAL_PISTACHIO_CATCH'];d.active=true;d.roundEnded=false;d.idleSeconds=0;d._enterRoutineStep(0);maxStep=0;joins=0;started=id;running=true;}
function tick(dt){time+=dt;w.scene.updateMatrixWorld(true);prior.copy(w.conePivot.getWorldPosition(V()));w.updateTouristHand(paperReturnHandTarget(d,input.handWorldPos),.2,0,dt,false,time);d.update(dt,time,input);w.updateEnvironmentAnimations(time,dt,0,0,null,0);cam.update(dt);w.scene.updateMatrixWorld(true);maxStep=Math.max(maxStep,prior.distanceTo(w.conePivot.getWorldPosition(V())));if(d.trickTransition!==previousJoin&&d.trickTransition)joins++;previousJoin=d.trickTransition;}
d.setOrderConfig(3,[0,2,1],31);d.resetRound(31,false);d.scoopCount=3;w.updateIceCreamScoops(3);select.value='VERTICAL_WINDMILL';go();
document.querySelector('#go').onclick=go;document.querySelector('#pause').onclick=()=>running=false;document.querySelector('#play').onclick=()=>running=true;
document.querySelector('#paper').onclick=()=>{select.value='SHELL_SWAP_DUEL';go();for(let i=0;i<360;i++){tick(1/60);if(!d.trickTransition&&!d.pendingTrickEntry&&!d.servingHandoff&&!d.entryPaperPreparation&&!d.pendingEntryPaper&&d.stageTimer>.2)break;}running=false;};document.querySelector('#hide').onclick=()=>document.querySelector('aside').hidden=true;
function frame(now){requestAnimationFrame(frame);const dt=Math.max(0,Math.min(.035,(now-last)/1000));last=now;if(running)tick(dt);cam.update(0);w.render();document.querySelector('output').textContent=JSON.stringify({selected:started,mechanic:d.currentMechanic,phase:d.subStep,mode:d.servingHandoff?'el değişimi':d.trickTransition?'poz geçişi':d.entryPaperPreparation?'peçete sarma':'numara',age:d.stageTimer,joins,maxStep:Number(maxStep.toFixed(4)),paper:w.stallEffects.napkinOwner,paperVisible:w.servingNapkin.visible,score:d.score,hearts:d.hearts});}requestAnimationFrame(frame);
</script></html>
