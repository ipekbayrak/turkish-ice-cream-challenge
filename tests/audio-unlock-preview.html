<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>İlk dokunuş ses kontrolü</title><style>body{background:#22170f;color:#fcebd3;font:18px system-ui;padding:24px}button{font:inherit;padding:16px}output{display:block;white-space:pre-wrap;margin-top:20px}</style><h1>İlk dokunuş ses kontrolü</h1><button id="unlock">İlk dokunuş</button><output>Hazırlanıyor</output><script type="module">
import{SoundEngine}from'/src/audio.js';const s=new SoundEngine();s.startMusic();const ctx=s.ctx;await ctx.suspend();let clicks=0,peak=0;const analyser=ctx.createAnalyser();s.masterGain.connect(analyser);const values=new Float32Array(analyser.fftSize);
document.querySelector('button').onclick=()=>{clicks++;s.unlockFromGesture();};
function frame(){analyser.getFloatTimeDomainData(values);let sum=0;for(const v of values)sum+=v*v;peak=Math.max(peak,Math.sqrt(sum/values.length));document.querySelector('output').textContent=JSON.stringify({state:ctx.state,enabled:s.enabled,unlocked:s._iosUnlocked,clicks,music:s.musicPlaying,peak:Number(peak.toFixed(6)),contexts:1});requestAnimationFrame(frame);}frame();
</script></html>
