<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Peçete teması ve ilerleme kontrolü</title><style>body{margin:0;background:#180c07;color:#fff2cc;font:12px system-ui}canvas{position:fixed;inset:0;width:100%;height:100%}#cue{position:fixed;top:60px;left:0;right:0;text-align:center;font-weight:700}aside{position:fixed;bottom:8px;left:8px;right:8px;background:#21150fee;border-radius:10px;padding:8px;display:flex;gap:5px;flex-wrap:wrap}button,select{font:inherit;padding:8px}output{width:100%;overflow-wrap:anywhere}</style><canvas></canvas><div id="cue"></div><aside><select aria-label="Usta"><option value="0">Kadir</option><option value="1">Pala</option><option value="2">Cezmi</option><option value="3" selected>Haydar</option></select><select aria-label="Top"><option selected>2</option><option>8</option></select><button id="old">Eski takılma</button><button id="fix">Aynı pozdan devam</button><output></output></aside>
<script type="module">
import * as THREE from 'three';import{GameWorld}from'/src/world.js';import{TrickDirector}from'/src/tricks.js';import{EncounterCamera}from'/src/encounter-camera.js';import{NapkinReturn,paperReturnHandTarget}from'/src/napkin-return.js';import{clearTrickTransition}from'/src/trick-transition.js';
const V=(x=0,y=0,z=0)=>new THREE.Vector3(x,y,z),noop=()=>{};const w=new GameWorld(document.querySelector('canvas')),cam=new EncounterCamera(w);w.encounterCamera=cam;cam.setPhase('play',true);
const save={lang:'tr',data:{unlockedStage:19,preferredScoopCount:2,preferredFlavors:[2,3]},hapticsEnabled:false,t:k=>k,discoverTrick:noop,setOrderPreferences:noop,recordStageResult:noop,getStageBestScore:()=>0,getUstaName:()=>'',getTrickInfo:id=>({name:id})};
const d=new TrickDirector(w,new Proxy({},{get:()=>noop}),save,{onRoundEnd:noop});const input={isPointerDown:false,isMoving:false,isReaching:false,normX:0,normY:-1,pointerEpoch:0,cancelEpoch:0,intentWorldPos:V(.26,1,.42),handWorldPos:V(.26,1,.42)};
let returning,running=false,last=performance.now(),time=0,fixedTime=0,priorSheet=null,oldGap=0;
function tick(dt){time+=dt;w.updateTouristHand(paperReturnHandTarget(d,input.handWorldPos),.15,0,dt,false,time);d.update(dt,time,input);w.updateEnvironmentAnimations(time,dt);cam.update(dt);}
function reset(){running=false;const count=Number(document.querySelector('[aria-label="Top"]').value),vendor=Number(document.querySelector('[aria-label="Usta"]').value);d.setOrderConfig(count,[2,3,2,3,2,3,2,3],19);d.resetRound(19,false);d.scoopCount=count;w.updateIceCreamScoops(count);w.setServingScale(count>4?1.18:1);w.updateServingLayout(1);w.setVendorCharacter(vendor);d.routine=['HAND_NAPKIN_OFFER','FINAL_PISTACHIO_CATCH'];d.active=true;d._enterRoutineStep(0);clearTrickTransition(d);d.subStep=3;d.stageTimer=.3;
 w.handoffCone('paddle');w.stallEffects.update(1);d.coneWorldPos.set(-.25,1.28,-.12);d.coneTargetPos.copy(d.coneWorldPos);w.paddleGroup.position.copy(d.coneWorldPos);w.coneSpring.pos.copy(d.coneWorldPos);w.coneSpring.target.copy(d.coneWorldPos);w.coneSpring.vel.set(0,0,0);
 w.setServingNapkin({owner:'vendor-hand',peel:1});w.stallEffects.update(1);returning=d.customerService.paperReturn=new NapkinReturn(d,{fromVendor:true,retreat:false});
 // Reproduce the former single-hand reach without changing production code.
 returning.prepareWorkPose=()=>{};priorSheet=w.servingNapkin;time=0;for(let i=0;i<360;i++)tick(1/60);oldGap=gap();fixedTime=0;}
function gap(){w.scene.updateMatrixWorld(true);return w.servingNapkin.getWorldPosition(V()).distanceTo(w.conePivot.localToWorld(V(0,-.065,0)));}
document.querySelector('#old').onclick=reset;document.querySelector('#fix').onclick=()=>{delete returning.prepareWorkPose;fixedTime=0;running=true;};for(const s of document.querySelectorAll('select'))s.onchange=reset;reset();
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.033,(now-last)/1000);last=now;if(running){fixedTime+=dt;tick(dt);if(returning.done&&d.subStep===4&&!d.servingHandoff&&!d.trickTransition)running=false;}w.render();document.querySelector('#cue').textContent=returning.done?'KÜLAHI AL':'İKİ ELİ TAKİP ET';document.querySelector('output').textContent=JSON.stringify({phase:returning.phase,subStep:d.subStep,done:returning.done,oldGap:+oldGap.toFixed(4),gap:+gap().toFixed(4),seconds:+fixedTime.toFixed(2),sameSheet:w.servingNapkin===priorSheet,wrapped:w.servingNapkin.parent===w.conePivot,transition:Boolean(d.servingHandoff||d.trickTransition)});}requestAnimationFrame(frame);
</script></html>
