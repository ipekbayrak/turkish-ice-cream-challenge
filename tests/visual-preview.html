<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Animasyon kontrolü — geliştirme</title><style>body{margin:0;background:#140805;color:#fff;font:12px system-ui}canvas{position:fixed;inset:0}section{position:fixed;bottom:12px;left:12px;right:12px;padding:12px;background:#170e08e8;border:1px solid #ad854a;border-radius:12px;z-index:2;display:flex;gap:8px;flex-wrap:wrap;align-items:center}button,select,input{font:inherit;padding:8px}output{width:100%;white-space:pre-wrap}label{display:flex;gap:4px;align-items:center}</style><canvas id="scene"></canvas><section><select id="trick"><option>SCRAPE_FLAVOR_SCOOP</option><option>GIANT_BLOCK_TEASE</option><option>MIDAIR_BLOCK_SOMERSAULT</option><option>BELL_RHYTHM_FEINT</option><option>EYE_LOCK_RHYTHM_CHASE</option><option>SHAFT_SPIN_360</option><option>MEGA_TAFFY_SLICE</option><option>WHOLE_MOLD_ON_CONE</option><option>SCOOP_LIFT_BACK</option><option>BONUS_SCOOP_TAKEBACK</option></select><button id="play">Oynat</button><button id="pause">Durdur</button><button id="reset">Başa al</button><label>An <input id="position" style="width:70px" type="number" min="0" max="4" value="0" step="0.01"></label><button id="afk">Çan gösterisi</button><button id="cut">Kesme anı</button><output id="metrics"></output></section><script type="module">
import * as THREE from 'three';
import {GameWorld} from '/src/world.js';import {SoundEngine} from '/src/audio.js';import {TrickDirector} from '/src/tricks.js';
const world=new GameWorld(document.querySelector('canvas'));const sound=new SoundEngine();
const save={data:{unlockedStage:1,preferredScoopCount:3,preferredFlavors:[1,1,1,1],tutorialCompleted:true},hapticsEnabled:false,t:k=>k,discoverTrick(){},recordStageResult(){},getStageBestScore(){return 0;},getUstaName(){return 'Usta';},getTrickInfo(id){return {name:id,icon:'',desc:''};}};
const director=new TrickDirector(world,sound,save,{onRoundEnd(){}});const input={isPointerDown:false,isReaching:false,isMoving:false,normX:0,normY:-1,vx:0,vy:0,speed:0,handWorldPos:new THREE.Vector3(.22,1.04,.64),intentWorldPos:new THREE.Vector3(.22,1.04,.64),pointerEpoch:0,cancelEpoch:0};
let running=false,afk=false,time=0,previous=performance.now();
function reset(){const id=document.getElementById('trick').value;director.resetRound(1,false);director.routine=[id,'FINAL_PISTACHIO_CATCH'];director.scoopCount=1;world.updateIceCreamScoops(1);director._enterRoutineStep(0);director.active=true;director.config={...director.config,speedMult:1};director.idleSeconds=0;world.setVendorCharacter(1);afk=false;time=0;document.getElementById('position').value=0;}
reset();document.getElementById('play').onclick=()=>{sound.init();running=true;};document.getElementById('pause').onclick=()=>{running=false;};document.getElementById('reset').onclick=()=>{running=false;reset();};document.getElementById('trick').onchange=()=>{running=false;reset();};document.getElementById('afk').onclick=()=>{reset();director.isAfkShowActive=true;director.afkScenario=1;director.afkTimer=0;director.lastAfkBeatTime=-1;afk=true;running=true;sound.init();};
document.getElementById('position').oninput=e=>{running=false;const target=+e.target.value;reset();for(let t=0;t<target;t+=1/120){director.update(1/120,t,input);world.updateEnvironmentAnimations(t,1/120,0,0,null,0);}document.getElementById('position').value=target;time=target;};
function frame(now){requestAnimationFrame(frame);const dt=Math.max(0,Math.min(.035,(now-previous)/1000));previous=now;if(running){time+=dt;if(afk){director.presentationExact=false;director.presentationBell=null;director._updateAfkShow(dt,time);director._applyKinematics(dt,time,input);}else{director.idleSeconds=0;director.update(dt,time,input);}world.updateEnvironmentAnimations(time,dt,0,0,(p,x,i)=>sound.playBellNote(i,p,x),sound.getVoiceMouthOpen());document.getElementById('position').value=director.stageTimer;}world.render();const rear=world.paddleRearGripAnchor.getWorldPosition(new THREE.Vector3());const left=world.lArmRig.handGroup.getWorldPosition(new THREE.Vector3());const right=world.rArmRig.handGroup.getWorldPosition(new THREE.Vector3());const face=world.projectToScreen(world.vendorHead.getWorldPosition(new THREE.Vector3()));document.getElementById('metrics').textContent=`${director.currentMechanic} · ${director.stageTimer.toFixed(2)}s · adım ${director.subStep}\nKalıp: ${world.giantBlockGroup.visible?'görünür':'kovada'} · külah: ${world.coneHeldByVendor?'sol elde':'çubukta'} · sağ tutuş mesafesi: ${right.distanceTo(rear).toFixed(3)}m · yüz: ${Math.round(face.x)},${Math.round(face.y)} · son çan: ${director.lastBellContact}`;}
document.getElementById('cut').onclick=()=>{running=false;document.getElementById('trick').value='MEGA_TAFFY_SLICE';reset();for(let i=0;i<60;i++){director.update(1/120,i/120,input);world.updateEnvironmentAnimations(i/120,1/120,0,0,null,0);}world.triggerSlice(new THREE.Vector3(0,1.22,.18),0x76c84d,1);world.stretchyStrand.detach();for(let i=0;i<12;i++)world.updateEnvironmentAnimations(.5+i/60,1/60,0,0,null,0);};
requestAnimationFrame(frame);
</script></html>
