<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tam numara akışı kontrolü</title><style>body{margin:0;background:#180c06;color:#fff1d5;font:12px system-ui}canvas{position:fixed;inset:0;width:100%;height:100%}#guide{pointer-events:none}#cue{position:fixed;top:60px;left:0;right:0;text-align:center;font-weight:700;pointer-events:none}aside{position:fixed;bottom:8px;left:8px;right:8px;background:#20150fee;border-radius:12px;padding:8px;display:flex;gap:5px;flex-wrap:wrap}select,button,input{font:inherit;padding:7px;max-width:100%}input{width:42px}output{display:block;width:100%;white-space:pre-wrap}</style><canvas id="scene"></canvas><canvas id="guide"></canvas><div id="cue"></div><aside><select aria-label="Numara" id="show"></select><select aria-label="Usta" id="vendor"><option value="0">Kadir</option><option value="1">Pala</option><option value="2">Cezmi</option><option value="3" selected>Haydar</option></select><label>Top <input aria-label="Top" id="count" type="number" min="1" max="12" value="8"></label><select aria-label="Tempo" id="pace"><option value="1">Başlangıç</option><option value="31">Hızlı</option><option value="46" selected>12 top temposu</option></select><button id="start">Oynat</button><button id="campaign">Tam tur</button><button id="layers">Katman görünümü</button><button id="relay">Aktarım görünümü</button><button id="music">Müzikle oynat</button><button id="pause">Duraklat</button><output></output></aside>
<script type="module">
import {GameWorld}from'/src/world.js';import{TRICK_CATALOG}from'/src/protocol.js';import{makeEncounterFixture}from'/tests/encounter-fixture.js';import{EncounterDriver}from'/tests/encounter-driver.js';import{drawFigureEightGuide}from'/src/gesture-guide-view.js';
import{SoundEngine}from'/src/audio.js';const audioSound=new SoundEngine();
const $=id=>document.getElementById(id),w=new GameWorld($('scene')),f=makeEncounterFixture({world:w,width:innerWidth,height:innerHeight,Driver:EncounterDriver});
for(const t of TRICK_CATALOG){const o=new Option(t.names?.tr||t.id,t.id);$('show').add(o);}$('show').add(new Option('Topları kazı','SCRAPE_FLAVOR_SCOOP'));$('show').value='SCOOP_AIR_CATCH';
let inspect=null;
let running=false,done=false,campaign=false,id='',last=performance.now();
const nativeAuto=new URLSearchParams(location.search).get('autorun')==='1',nativeCases=[],nativeReports=[];let nativeIndex=0,nativeCaseStart=0,nativeStarted=0;
if(nativeAuto)for(const vendor of [0,1,2,3])for(const count of [2,12])for(const id of (import.meta.env.VITE_NATIVE_IDS||'GIANT_BLOCK_TEASE,FIGURE_EIGHT_WEAVE,DOUBLE_CONE_SLIDE,SCOOP_CONE_RELAY,LAYERED_SERVICE_TEASE,MEGA_TAFFY_SLICE,FINAL_PISTACHIO_CATCH').split(','))nativeCases.push({id,vendor,count});
function nativeNext(){if(nativeIndex>=nativeCases.length){console.info('MARAS_ENCOUNTER_DONE '+JSON.stringify({total:nativeReports.length,passed:nativeReports.filter(r=>r.ok).length,failed:nativeReports.filter(r=>!r.ok).length,seconds:(performance.now()-nativeStarted)/1000,viewport:[innerWidth,innerHeight,devicePixelRatio]}));return;}const c=nativeCases[nativeIndex++];$('show').value=c.id;$('vendor').value=c.vendor;$('count').value=c.count;$('pace').value=46;reset(false);nativeCaseStart=performance.now();}
function nativeFinished(){const c=nativeCases[nativeIndex-1],r={...c,ok:done,seconds:(performance.now()-nativeCaseStart)/1000,state:f.state()};nativeReports.push(r);console.info('MARAS_ENCOUNTER_CASE '+JSON.stringify(r));setTimeout(nativeNext,250);}
if(nativeAuto)setTimeout(()=>{nativeStarted=performance.now();console.info('MARAS_ENCOUNTER_START '+JSON.stringify({total:nativeCases.length}));nativeNext();},1500);
function reset(full=false){inspect=null;campaign=full;id=$('show').value;f.reset({id,vendor:Number($('vendor').value),count:Number($('count').value),pace:Number($('pace').value),campaign:full,forceFeint:full});done=false;running=true;}
$('layers').onclick=()=>{$('show').value='LAYERED_SERVICE_TEASE';reset();inspect='layers';};$('relay').onclick=()=>{$('show').value='SCOOP_CONE_RELAY';reset();inspect='relay';};
$('music').onclick=async()=>{await audioSound.unlockFromGesture();f.d.sound=audioSound;reset();};
$('start').onclick=()=>reset();$('campaign').onclick=()=>reset(true);$('pause').onclick=()=>running=false;
const ctx=$('guide').getContext('2d');function resize(){const r=Math.min(devicePixelRatio||1,2);$('guide').width=innerWidth*r;$('guide').height=innerHeight*r;ctx.setTransform(r,0,0,r,0,0);}addEventListener('resize',resize);resize();
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1000);last=now;if(running){f.tick(dt);if(inspect&&!f.d.trickTransition&&!f.d.entryPaperPreparation&&((inspect==='layers'&&f.d.subStep===0&&f.d.stageTimer>.5)||(inspect==='relay'&&f.d.subStep===1&&f.d.stageTimer>.60))){running=false;inspect=null;}done=campaign||id==='FINAL_PISTACHIO_CATCH'?f.outcome==='MASTER_CATCH':f.d.routineIndex>=(id==='SCRAPE_FLAVOR_SCOOP'?Number($('count').value):1);if(done||f.d.roundEnded||nativeAuto&&(performance.now()-nativeCaseStart)>60000){running=false;if(nativeAuto)nativeFinished();}}f.cam.update(0);w.render();ctx.clearRect(0,0,innerWidth,innerHeight);const g=f.d.getGestureGuide();if(running&&!g.quiet){ctx.strokeStyle=g.theme==='red'?'#fa8b74':'#71df99';ctx.lineWidth=2;for(const r of g.rings){ctx.beginPath();ctx.arc(r.x,r.y,r.radius,0,Math.PI*2);ctx.stroke();}if(g.figureEight)drawFigureEightGuide(ctx,g.figureEight);}
 $('cue').textContent=done?'TAMAMLANDI':running?'NUMARA OYNANIYOR':'KONTROL';document.querySelector('output').textContent=JSON.stringify({done,running,id,...f.state(),audio:audioSound.ctx?{state:audioSound.ctx.state,time:audioSound.ctx.currentTime,clock:f.d.rhythmClock?.realTime,phase:f.d.rhythmClock?.phase,scheduled:f.d.sound.musicTransport?.scheduledStep}:null});}requestAnimationFrame(frame);
</script></html>
