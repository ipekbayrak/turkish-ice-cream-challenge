<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Esnetme ve dik kesme — geliştirme</title>
<style>html,body{margin:0;height:100%;background:#180d08;color:#ffe8c2;font:12px system-ui}canvas{position:fixed;inset:0}aside{position:fixed;bottom:12px;left:12px;right:12px;border:1px solid #a5804a;background:#1d120bed;padding:10px;border-radius:12px;display:flex;flex-wrap:wrap;gap:6px;z-index:2}button,label,select,input{font:inherit;padding:7px}select,input{max-width:165px}button{background:#382619;color:#ffe8c2;border:1px solid #745532;border-radius:7px}output{width:100%;white-space:pre-wrap}label{display:flex;gap:5px}</style>
<canvas id="scene"></canvas><canvas id="guide" style="pointer-events:none"></canvas><aside><label>Lezzet <select id="flavor" aria-label="Lezzet"></select></label><label>Top <input id="count" aria-label="Top sayısı" type="number" min="1" max="8" value="3" style="width:40px"></label><button id="press">İt ve esnet</button><button id="cut">Hızlı dik kes</button><button id="slow">Yavaş sürükle</button><button id="parallel">Paralel sürükle</button><button id="release">Elini çek</button><button id="reset">Başa al</button><button id="pause">Durdur</button><button id="step">+0,1 sn</button><label><input type="checkbox" id="touch" checked>Dokunmatik</label><output id="metrics"></output></aside>
<script type="module">
import * as THREE from 'three';import {GameWorld} from '/src/world.js';import {TrickDirector} from '/src/tricks.js';import {SoundEngine} from '/src/audio.js';import {RoutinePreviewDriver} from '/tests/routines-driver.js';import {stretchCutGuide} from '/src/stretch-cut.js';import {TouchArmView} from '/src/touch-arm-view.js';import {ICE_CREAM_FLAVORS} from '/src/protocol.js';import {getVenueForStage} from '/src/venues.js';
const $=id=>document.getElementById(id),world=new GameWorld($('scene')),sound=new SoundEngine();sound.setMuted(true);const noop=()=>{};
const save={lang:'tr',data:{unlockedStage:30,preferredScoopCount:3,preferredFlavors:[0,2,1],tutorialCompleted:true},hapticsEnabled:false,t:k=>k,discoverTrick:noop,setOrderPreferences:noop,recordStageResult:noop,getStageBestScore:()=>0,getUstaName:()=>'',getTrickInfo:id=>({name:id})};
const director=new TrickDirector(world,sound,save,{onRoundEnd:noop,onTrickStart:noop}),driver=new RoutinePreviewDriver(director,world),arm=new TouchArmView(world);
let time=0,last=performance.now(),running=true,mode='wait',age=0,path=null,key=0;
for(const flavor of ICE_CREAM_FLAVORS){const option=document.createElement('option');option.value=flavor.index;option.textContent=flavor.names.tr;$('flavor').append(option);}$('flavor').value='1';
const params=new URLSearchParams(location.search);if(params.has('flavor'))$('flavor').value=String(THREE.MathUtils.clamp(Number(params.get('flavor'))||0,0,5));if(params.has('scoops'))$('count').value=THREE.MathUtils.clamp(Number(params.get('scoops'))||1,1,8);
function reset(){arm.setActive(false);world.resetTransientPresentation();const count=THREE.MathUtils.clamp(Math.round(Number($('count').value)||1),1,8),flavor=Number($('flavor').value)||0,stage=count>4?(count-3)*5+1:1;$('count').value=count;world.setVenue(getVenueForStage(stage));director.setOrderConfig(count,Array(count).fill(flavor),stage);director.resetRound(stage,false);director.routine=['MEGA_TAFFY_SLICE','FINAL_PISTACHIO_CATCH'];director.scoopCount=count;world.updateIceCreamScoops(count,false);director._enterRoutineStep(0);director.active=true;director.config={...director.config,speedMult:1};driver.setTouchMode($('touch').checked);mode='wait';time=age=0;running=true;for(let i=0;i<45;i++)step(1/60);path=stretchCutGuide(world);}
function start(next){mode=next;age=0;key++;path=stretchCutGuide(world);running=true;}
function aim(screen,dt){if(driver.touchEnabled)driver.reachScreen(String(key),screen,path.viewport,dt);else driver.reach(String(key),new THREE.Vector3((screen.x/path.viewport.width*2-1)*.54,1.22+(1-screen.y/path.viewport.height*2)*.36,.27),dt);}
function step(dt){time+=dt;age+=dt;driver.time=time;
 if(mode==='wait'||director.currentMechanic!=='MEGA_TAFFY_SLICE'||director.pendingTrickAdvance>0)driver.release();
 else {const progress=mode==='press'?0:THREE.MathUtils.clamp((age-.08)/(mode==='slow'?1.0:.16),0,1),axis=mode==='parallel'?path.tangent:path.normal;aim({x:path.center.x+axis.x*path.span*progress,y:path.center.y+axis.y*path.span*progress},dt);}
 const input=driver.input;if(input.isPointerDown)input.handWorldPos.copy(input.intentWorldPos);else input.handWorldPos.lerp(new THREE.Vector3(.22,1.04,.64),dt*18);
 world.updateTouristHand(input.handWorldPos,input.isPointerDown ? .36 : .14,0,dt,input.pointerType==='touch'&&input.isPointerDown);
 director.idleSeconds=0;director.update(dt,time,input);world.updateEnvironmentAnimations(time,dt,0,0,null,0);arm.update(input.pointerType==='touch'&&input.isPointerDown,input.pointerX,input.pointerY,innerWidth,innerHeight);
 if(director.currentMechanic!=='MEGA_TAFFY_SLICE'){running=false;mode='done';}
}
$('press').onclick=()=>start('press');$('cut').onclick=()=>start('cut');$('slow').onclick=()=>start('slow');$('parallel').onclick=()=>start('parallel');$('release').onclick=()=>start('wait');$('reset').onclick=reset;$('pause').onclick=()=>running=false;$('step').onclick=()=>{running=false;for(let i=0;i<6;i++)step(1/60);};$('touch').onchange=reset;$('flavor').onchange=reset;$('count').onchange=reset;
const ctx=$('guide').getContext('2d');function resize(){const ratio=Math.min(devicePixelRatio||1,2);$('guide').width=innerWidth*ratio;$('guide').height=innerHeight*ratio;ctx.setTransform(ratio,0,0,ratio,0,0);}window.addEventListener('resize',()=>{resize();driver.release();});resize();reset();
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.035,(now-last)/1000);last=now;if(running)step(dt);world.render();ctx.clearRect(0,0,innerWidth,innerHeight);const g=stretchCutGuide(world);
 if(world.stretchyStrand.active&&g){ctx.strokeStyle='#bce8bd99';ctx.lineWidth=2;ctx.setLineDash([4,7]);ctx.beginPath();ctx.moveTo(g.from.x,g.from.y);ctx.lineTo(g.to.x,g.to.y);ctx.stroke();ctx.setLineDash([]);}
 if(driver.input.isPointerDown){ctx.fillStyle='#fff5dfb3';ctx.beginPath();ctx.arc(driver.input.pointerX,driver.input.pointerY,5,0,Math.PI*2);ctx.fill();}
 $('metrics').textContent=`${$('flavor').selectedOptions[0].textContent} · ${director.scoopCount} top · ${mode} · ${director.currentMechanic} · ${time.toFixed(2)}s\nBaskı: ${(world.stretchyStrand.pressureOffset?.length()||0).toFixed(3)}m · Kesildi: ${director.cutGesture?.completed?'evet':'hayır'} · Puan: ${director.score}\nİki parça: ${world.stallEffects.sliceGroup.visible?'görünür':'—'} · Kesme sonrası: ${director.pendingTrickAdvance.toFixed(2)}s · El kökü: ${world.touristHand.position.toArray().map(n=>n.toFixed(2)).join(', ')}`;
}requestAnimationFrame(frame);
</script></html>
