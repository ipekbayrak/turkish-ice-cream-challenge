<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Araştırılan servis hareketleri — geliştirme</title>
<style>body{margin:0;background:#180d08;color:#ffe9c3;font:12px system-ui}canvas{position:fixed;inset:0}aside{position:fixed;bottom:10px;left:10px;right:10px;padding:10px;background:#21170ff0;border:1px solid #b18e52;border-radius:12px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}select,button,input{font:inherit;padding:7px}input[type=number]{width:46px}output{width:100%;white-space:pre-wrap}</style>
<canvas id="scene"></canvas><aside><select id="show" aria-label="Gösteri"><option value="WRIST_NEAR_MISS">Bilekten son anda</option><option value="SCOOP_CONE_RELAY">Toplar külah değiştiriyor</option></select><label>Top <input id="count" aria-label="Top" type="number" min="1" max="8" value="2"></label><select id="mode" aria-label="Girdi"><option value="auto">Bilinçli hareket</option><option value="still">Sabit el</option><option value="jitter">Küçük titreşim</option></select><label><input id="touch" type="checkbox" checked>Dokunmatik</label><button id="reset">Başa al</button><button id="play">Oynat</button><button id="pause">Durdur</button><button id="next">Sonraki adım</button><button id="all">Tamamla</button><output id="metrics"></output></aside>
<script type="module">
import * as THREE from 'three';import{GameWorld}from'/src/world.js';import{TrickDirector}from'/src/tricks.js';import{SoundEngine}from'/src/audio.js';import{RoutinePreviewDriver}from'/tests/routines-driver.js';import{RESEARCHED_SERVICE_IDS,researchedServiceCue}from'/src/researched-service.js';import{TouchArmView}from'/src/touch-arm-view.js';import{poleGripRenderTarget}from'/src/cone-grip.js';import{getVenueForStage}from'/src/venues.js';
const $=id=>document.getElementById(id),V=(x=0,y=0,z=0)=>new THREE.Vector3(x,y,z),noop=()=>{};
const world=new GameWorld($('scene')),arm=new TouchArmView(world),sound=new SoundEngine();sound.setMuted(true);
const save={lang:'tr',data:{unlockedStage:30,preferredScoopCount:2,preferredFlavors:[0,2,1,3,4,5,0,2],tutorialCompleted:true},hapticsEnabled:false,t:k=>k,discoverTrick:noop,setOrderPreferences:noop,recordStageResult:noop,getStageBestScore:()=>0,getUstaName:()=>'',getTrickInfo:id=>({name:id})};
let running=false,time=0,previous=performance.now(),result='',generation=0;
const d=new TrickDirector(world,sound,save,{onRoundEnd:data=>{result=data.outcomeType;running=false;}});
class Driver extends RoutinePreviewDriver {
 update(dt){
  const d=this.director;if(!RESEARCHED_SERVICE_IDS.includes(d.currentMechanic)&&d.currentMechanic!=='FINAL_PISTACHIO_CATCH')return super.update(dt);
  this.time+=dt;if(!d.active||d.roundEnded){this.release();return this.input;}
  if($('mode').value!=='auto'){
   this.begin('held-static');const jitter=$('mode').value==='jitter'?Math.sin(this.time*80)*.003:0;
   this.move(V(.025+jitter,1.24,.26),dt);this.mode=$('mode').value;return this.input;
  }
  const key=`${d.currentMechanic}:${d.subStep}:${d.researchedService?.feints||0}`;
  if(d.currentMechanic==='FINAL_PISTACHIO_CATCH'){
   if(d.subStep===0)this.reach(key,d.coneWorldPos,dt);
   else{this.begin(key);this.move(V(.04,this.time-this.actionStart<.10?1.24:1.04,.26),dt);this.mode='pull';}
  }else{
   const cue=researchedServiceCue(d);
   if(cue.kind!=='reach')this.release();
   else if(cue.screen&&this.touchEnabled)this.reachScreen(key,cue.screen,cue.viewport,dt);
   else if(cue.screen){const nx=cue.screen.x/cue.viewport.width*2-1,ny=1-cue.screen.y/cue.viewport.height*2;this.reach(key,V(nx*.54,1.22+ny*.36,.26),dt);}
   else this.reach(key,cue.target,dt);
  }
  return this.input;
 }
}
const driver=new Driver(d,world);
function reset(){arm.setActive(false);running=false;result='';time=0;generation++;const count=Math.max(1,Math.min(8,+$('count').value||2)),stage=Math.max(8,count>4?(count-3)*5+1:8);
 world.resetTransientPresentation();world.setVenue(getVenueForStage(stage));d.setOrderConfig(count,[0,2,1,3,4,5,0,2],stage);d.resetRound(stage,false);d.config={...d.config,speedMult:1};d.routine=[$('show').value,'FINAL_PISTACHIO_CATCH'];d.scoopCount=count;world.updateIceCreamScoops(count,false);driver.setTouchMode($('touch').checked);d.startRound();metrics();}
function step(){if(d.roundEnded)return;const dt=1/60,s=driver.update(dt);time+=dt;const carrying=d.heldItem||world.conePivot.parent===world.heldSocket;
 const target=s.isReaching?s.intentWorldPos.clone():carrying?s.handWorldPos.clone():V(.22,1.04,.64);
 if(d.isGraspingPaddleCone)target.copy(d.coneWorldPos).add(V(0,-.03,.04));
 const direct=driver.touchEnabled&&s.isPointerDown&&!d.isGraspingPaddleCone;if(direct)s.handWorldPos.copy(target);else s.handWorldPos.lerp(target,.3);
 s.grabCurl=(carrying||d.isGraspingPaddleCone) ? .98 : .25;world.setPlayerConeGrip(d.isGraspingPaddleCone);
 const rendered=d.isGraspingPaddleCone&&world.conePivot.parent===world.paddleGroup?poleGripRenderTarget(world,s.handWorldPos,d.coneWorldPos):s.handWorldPos;
 world.updateTouristHand(rendered,s.grabCurl,0,dt,direct);d.update(dt,time,s);world.updateEnvironmentAnimations(time,dt,0,0,null,0);arm.update(driver.touchEnabled&&s.isPointerDown,s.pointerX,s.pointerY,innerWidth,innerHeight);if(d.roundEnded)running=false;}
const parent=o=>o.parent===world.heldSocket?'müşteri':o.parent===world.lArmRig.handGroup?'usta eli':o.parent===world.conePivot?'asıl külah':o.parent===world.outerConeGroup?'ikinci külah':o.parent===world.paddleGroup?'çubuk':'diğer';
function metrics(){$('metrics').textContent=`${d.currentMechanic} · adım ${d.subStep} · ${time.toFixed(2)}sn · ${d.scoopCount}/${d.targetScoopCount} top\nBilek kaçışı: ${d.researchedService?.feints||0} · Puan ${d.score} · Hak ${d.hearts}\nKülah: ${parent(world.conePivot)} · dış: ${parent(world.outerConeGroup)}${world.outerConeGroup.visible?'':' (gizli)'} · dondurma: ${parent(world.scoopStackGroup)}\nAynı nesneler: ${world.conePivot.uuid.slice(0,6)} / ${world.outerConeGroup.uuid.slice(0,6)} / ${world.scoopStackGroup.uuid.slice(0,6)}\n${result||(d.roundEnded?'Sonuç bekleniyor':'Kontrol hazır')}`;}
$('reset').onclick=reset;$('show').onchange=reset;$('count').onchange=reset;$('touch').onchange=reset;$('mode').onchange=reset;$('play').onclick=()=>running=true;$('pause').onclick=()=>running=false;
$('next').onclick=()=>{running=false;const key=`${d.currentMechanic}:${d.subStep}`;for(let i=0;i<900&&!d.roundEnded&&key===`${d.currentMechanic}:${d.subStep}`;i++)step();metrics();};$('all').onclick=()=>{running=false;for(let i=0;i<2400&&!d.roundEnded;i++)step();metrics();};
const params=new URLSearchParams(location.search);if(params.has('show'))$('show').value=params.get('show');if(params.has('scoops'))$('count').value=params.get('scoops');reset();
function frame(now){requestAnimationFrame(frame);if(running){const count=Math.min(6,Math.max(1,Math.round((now-previous)/1000*60)));for(let i=0;i<count;i++)step();}previous=now;world.render();metrics();}requestAnimationFrame(frame);
</script></html>
