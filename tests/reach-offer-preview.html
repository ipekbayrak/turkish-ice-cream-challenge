<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reach & Grab — dar ekran kontrolü</title>
<style>body{margin:0;background:#160a05;color:#ffedcd;font:12px system-ui}canvas{position:fixed;width:100%;height:100%;inset:0}#cue{position:fixed;top:64px;left:0;right:0;text-align:center;pointer-events:none}aside{position:fixed;bottom:8px;left:8px;right:8px;background:#20160fee;padding:8px;border-radius:12px;display:flex;gap:6px;flex-wrap:wrap}button,select{padding:8px;font:inherit}output{width:100%}</style>
<canvas></canvas><div id="grab" style="position:fixed;border:3px solid #4ade80;border-radius:50%;pointer-events:none;display:none"></div><div id="cue">UZAN VE YAKALA</div><aside><button id="second">İkinci uzatış</button><button id="start">İki yakalamayı oyna</button><label>Top <select aria-label="Top sayısı"><option>1</option><option selected>2</option><option>4</option><option>8</option></select></label><button id="pause">Durdur</button><output></output></aside>
<script type="module">
import * as THREE from 'three';import{GameWorld}from'/src/world.js';import{TrickDirector}from'/src/tricks.js';import{EncounterCamera}from'/src/encounter-camera.js';import{TouchReach}from'/src/touch-reach.js';import{poleGripRenderTarget}from'/src/cone-grip.js';import{extraTrickCue}from'/src/trick-extensions.js';
const lift=new URLSearchParams(location.search).has('lift');
const V=(x=0,y=0,z=0)=>new THREE.Vector3(x,y,z),noop=()=>{},canvas=document.querySelector('canvas');
const w=new GameWorld(canvas),sound=new Proxy({},{get:()=>noop}),save={lang:'tr',data:{unlockedStage:31,preferredScoopCount:2,preferredFlavors:[0,2]},hapticsEnabled:false,t:k=>k,discoverTrick:noop,setOrderPreferences:noop,recordStageResult:noop,getStageBestScore:()=>0,getUstaName:()=>'',getTrickInfo:id=>({name:id})};
const d=new TrickDirector(w,sound,save,{onRoundEnd:noop}),cam=new EncounterCamera(w),reach=new TouchReach(w);w.encounterCamera=cam;cam.setPhase('play',true);
const input={isPointerDown:false,isMouseHover:false,isReaching:false,isMoving:false,normX:0,normY:-1,vx:0,vy:0,speed:0,handWorldPos:V(.22,1.04,.64),intentWorldPos:V(.22,1.04,.64),pointerEpoch:0,cancelEpoch:0};
let time=0,last=performance.now(),running=true,maxEdge=0,lastMove=performance.now();
function start(phase=0){const count=Number(document.querySelector('select').value);d.setOrderConfig(count,[0,2,1,3,0,2,1,3],31);d.resetRound(31,false);d.scoopCount=count;w.updateIceCreamScoops(count);w.updateServingLayout(1);w.setServingScale(count>4?1.18:1);d.routine=[lift?'SCOOP_LIFT_BACK':'SHAFT_SPIN_360','FINAL_PISTACHIO_CATCH'];d.active=true;d._enterRoutineStep(0);d.subStep=lift?0:phase;maxEdge=0;running=true;}
function move(e){if(!reach.camera)reach.begin(w.camera,innerWidth,innerHeight);const dt=Math.max(.016,(performance.now()-lastMove)/1000),px=input.normX,py=input.normY;lastMove=performance.now();input.intentWorldPos.copy(reach.update(e.clientX,e.clientY,.26,e.pointerType));input.normX=reach.aimX;input.normY=reach.aimY;input.vx=(input.normX-px)/dt;input.vy=(input.normY-py)/dt;input.speed=Math.hypot(input.vx,input.vy);input.isMouseHover=e.pointerType==='mouse';input.isReaching=true;input.isMoving=input.speed>.03;}
canvas.onpointerdown=e=>{input.pointerEpoch++;input.isPointerDown=true;canvas.setPointerCapture(e.pointerId);move(e);};canvas.onpointermove=move;
canvas.onpointerup=e=>{input.isPointerDown=false;if(e.pointerType!=='mouse'){input.isReaching=false;input.cancelEpoch++;reach.end();}};
document.querySelector('#second').onclick=()=>start(1);document.querySelector('#start').onclick=()=>start(0);document.querySelector('#pause').onclick=()=>running=!running;document.querySelector('select').onchange=()=>start(1);
start(1);
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.033,(now-last)/1000);last=now;if(running){time+=dt;d.idleSeconds=0; // Isolate this numara; production AFK behaviour is unchanged.
if(d.isGraspingPaddleCone)input.handWorldPos.lerp(d.coneWorldPos.clone().add(V(0,-.03,.04)),Math.min(1,dt*18));else input.handWorldPos.copy(input.intentWorldPos);
w.setPlayerConeGrip(d.isGraspingPaddleCone);const target=d.isGraspingPaddleCone?poleGripRenderTarget(w,input.handWorldPos,d.coneWorldPos):input.handWorldPos;
w.updateTouristHand(target,d.isGraspingPaddleCone?.98:.14,0,dt,!d.isGraspingPaddleCone,time);d.update(dt,time,input);w.updateEnvironmentAnimations(time,dt);cam.update(dt);input.speed*=Math.exp(-dt*18);input.isMoving=input.speed>.05;
if(d.currentMechanic==='FINAL_PISTACHIO_CATCH')running=false;}
w.scene.updateMatrixWorld(true);const cue=lift?extraTrickCue(d):null;const marker=document.querySelector('#grab');if(cue?.screen){marker.style.display='block';const r=cue.radius||38;Object.assign(marker.style,{width:r*2+'px',height:r*2+'px',left:cue.screen.x-r+'px',top:cue.screen.y-r+'px'});}const p=d.coneWorldPos.clone().project(w.camera),screen=w.projectToScreen(d.coneWorldPos);if(!d.trickTransition)maxEdge=Math.max(maxEdge,Math.abs(p.x));w.render();document.querySelector('output').textContent=JSON.stringify({phase:d.subStep,mechanic:d.currentMechanic,score:d.score,caught:Boolean(d.extraTrick?.fullCaught),held:d.heldItem,cone:[Math.round(screen.x),Math.round(screen.y)],maxEdge:+maxEdge.toFixed(3),joining:Boolean(d.trickTransition)});document.querySelector('#cue').textContent=d.currentMechanic==='FINAL_PISTACHIO_CATCH'?'İKİ YAKALAMA TAMAMLANDI':lift?(cue?.kind==='pull'?'KÜLAHI KENDİNE ÇEK':cue?.kind==='wait'?'USTAYI İZLE':'UZAN VE YAKALA'):`UZAN VE YAKALA · ${d.subStep+1}/2`;}
requestAnimationFrame(frame);
</script></html>
