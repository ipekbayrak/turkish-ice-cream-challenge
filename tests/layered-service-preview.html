<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Külah ve peçete servisi — geliştirme</title><style>body{margin:0;background:#170d08;color:#ffe8c2;font:12px system-ui}canvas{position:fixed;inset:0}aside{position:fixed;bottom:10px;left:10px;right:10px;background:#21180ff0;padding:10px;border:1px solid #b38c50;border-radius:12px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}button,select,input{font:inherit;padding:7px}output{white-space:pre-wrap;width:100%}input[type=number]{width:50px}</style><canvas id="scene"></canvas><aside><select id="show" aria-label="Gösteri"><option value="LAYERED_SERVICE_TEASE">Külah, Peçete, Bir Daha</option><option value="DOUBLE_CONE_SLIDE">Çift külah</option><option value="FINAL_PISTACHIO_CATCH">Son servis</option></select><label>Top <input id="scoops" aria-label="Top" type="number" min="1" max="8" value="3"></label><label><input type="checkbox" id="touch" aria-label="Dokunmatik" checked>Dokunmatik</label><button id="reset">Başa al</button><button id="play">Oynat</button><button id="pause">Durdur</button><button id="next">Sonraki adım</button><button id="all">Tamamla</button><output id="metrics"></output></aside>
<script type="module">
import {paperReturnHandTarget} from '/src/napkin-return.js';import * as THREE from 'three';import{poleGripRenderTarget}from'/src/cone-grip.js';import{GameWorld}from'/src/world.js';import{TrickDirector}from'/src/tricks.js';import{SoundEngine}from'/src/audio.js';import{RoutinePreviewDriver}from'/tests/routines-driver.js';import{LAYERED_SERVICE_ID,LAYERED_SERVICE_PHASES,layeredServiceCue,layeredEmptyOfferTarget}from'/src/serving-sequence.js';import{TouchArmView}from'/src/touch-arm-view.js';import{getVenueForStage}from'/src/venues.js';
const $=id=>document.getElementById(id),V=(x=0,y=0,z=0)=>new THREE.Vector3(x,y,z),noop=()=>{};
const world=new GameWorld($('scene')),arm=new TouchArmView(world),sound=new SoundEngine();sound.setMuted(true);
const save={lang:'tr',data:{unlockedStage:30,preferredScoopCount:3,preferredFlavors:[0,1,2,3,4,5,0,1],tutorialCompleted:true},hapticsEnabled:false,t:k=>k,discoverTrick:noop,setOrderPreferences:noop,recordStageResult:noop,getStageBestScore:()=>0,getUstaName:()=>'',getTrickInfo:id=>({name:id})};
let result='',running=false,time=0,previous=performance.now();const d=new TrickDirector(world,sound,save,{onRoundEnd:data=>{result=data.outcomeType;running=false;}});
class ServiceDriver extends RoutinePreviewDriver{
 update(dt){
  if(![LAYERED_SERVICE_ID,'FINAL_PISTACHIO_CATCH'].includes(this.director.currentMechanic))return super.update(dt);
  this.time+=dt;const d=this.director,key=`${d.currentMechanic}:${d.subStep}`;
  if(!d.active||d.roundEnded||d.trickTransition||d.pendingTrickEntry||d.servingHandoff||d.entryPaperPreparation||d.pendingEntryPaper){this.release();return this.input;}
  if(d.currentMechanic===LAYERED_SERVICE_ID){const cue=layeredServiceCue(d);if(cue.kind==='wait')this.release();
   else if(cue.kind==='pull'){this.begin(key+':pull');this.mode='pull';this.move(new THREE.Vector3(.04,1.30-Math.min(1,Math.max(0,(this.time-this.actionStart-.08)/.18))*.30,.26),dt);}else if(cue.screen&&this.touchEnabled)this.reachScreen(key,cue.screen,cue.viewport,dt);else if(cue.screen)this.reach(key,V((cue.screen.x/cue.viewport.width*2-1)*.54,1.22+(1-cue.screen.y/cue.viewport.height*2)*.36,.27),dt,cue.kind);else this.reach(key,cue.target,dt,cue.kind);}
  else if(d.subStep===0)this.reach(key,d.coneWorldPos,dt);
  else {this.begin(key);this.move(V(.04,this.time-this.actionStart<.10?1.24:1.04,.26),dt);this.mode='pull';}
  return this.input;
 }
}
const driver=new ServiceDriver(d,world);
function reset(){arm.setActive(false);running=false;result='';time=0;const count=Math.max(1,Math.min(8,+$('scoops').value||3));const stage=Math.max(6,count>4?(count-3)*5+1:6);world.resetTransientPresentation();world.setVenue(getVenueForStage(stage));d.setOrderConfig(count,[0,1,2,3,4,5,0,1],stage);d.resetRound(stage,false);d.config={...d.config,speedMult:1};d.routine=[$('show').value,...($('show').value==='FINAL_PISTACHIO_CATCH'?[]:['FINAL_PISTACHIO_CATCH'])];d.scoopCount=count;world.updateIceCreamScoops(count);d.startRound();driver.setTouchMode($('touch').checked);metrics();}
function step(){if(d.roundEnded)return;const dt=1/60,s=driver.update(dt);time+=dt;const target=s.isReaching?s.intentWorldPos.clone():(d.heldItem||world.conePivot.parent===world.heldSocket)?s.handWorldPos.clone():V(.22,1.04,.64);if(d.isGraspingPaddleCone)target.copy(d.coneWorldPos).add(V(0,-.03,.04));const direct=driver.touchEnabled&&s.isPointerDown&&!d.isGraspingPaddleCone;if(direct)s.handWorldPos.copy(target);else s.handWorldPos.lerp(target,.3);s.grabCurl=d.heldItem ? .98 : .25;world.setPlayerConeGrip(d.isGraspingPaddleCone);const rendered=d.isGraspingPaddleCone&&world.conePivot.parent===world.paddleGroup?poleGripRenderTarget(world,s.handWorldPos,d.coneWorldPos):s.handWorldPos;world.updateTouristHand(paperReturnHandTarget(d,rendered),s.grabCurl,0,dt,direct);d.update(dt,time,s);world.updateEnvironmentAnimations(time,dt,0,0,null,0);arm.update(driver.touchEnabled&&s.isPointerDown,s.pointerX,s.pointerY,innerWidth,innerHeight,'touch',!d.paperReturnPose);if(d.roundEnded)running=false;}
const owner=o=>o.parent===world.heldSocket?'müşteri':o.parent===world.lArmRig.handGroup?'usta eli':o.parent===world.conePivot?'dolu külah':o.parent===world.outerConeGroup?'boş dış külah':o.parent===world.paddleGroup?'çubuk':'sahne';
function metrics(){const outer=layeredEmptyOfferTarget(world),input=driver.input;const targetInfo=outer?` · dış ekran ${Math.round(outer.screen.x)},${Math.round(outer.screen.y)} · dünya uzaklığı ${input.intentWorldPos.distanceTo(outer.position).toFixed(3)}m`:'';$('metrics').textContent=`${d.currentMechanic} · ${d.currentMechanic===LAYERED_SERVICE_ID?LAYERED_SERVICE_PHASES[d.subStep]:`adım ${d.subStep}`} · ${time.toFixed(2)}sn · ${d.scoopCount}/${d.targetScoopCount} top\nParmak ${Math.round(input.pointerX)},${Math.round(input.pointerY)} · niyet ${input.intentWorldPos.toArray().map(n=>n.toFixed(2)).join(',')}${targetInfo}\nDolu: ${owner(world.conePivot)} · dış: ${owner(world.outerConeGroup)}${world.outerConeGroup.visible?'':' (gizli)'} · peçete: ${owner(world.servingNapkin)}\nAynı nesneler: ${world.conePivot.uuid.slice(0,6)} / ${world.outerConeGroup.uuid.slice(0,6)} / ${world.servingNapkin.uuid.slice(0,6)} · bağ: ${world.stretchyStrand.active?'var':'yok'}\n${result||(d.roundEnded?'Kazandı':'Kontrol hazır')}`;}
$('reset').onclick=reset;$('show').onchange=reset;$('scoops').onchange=reset;$('touch').onchange=reset;$('play').onclick=()=>running=true;$('pause').onclick=()=>running=false;$('next').onclick=()=>{running=false;const key=`${d.currentMechanic}:${d.subStep}`;for(let i=0;i<900&&!d.roundEnded&&key===`${d.currentMechanic}:${d.subStep}`;i++)step();metrics();};$('all').onclick=()=>{running=false;for(let i=0;i<2700&&!d.roundEnded;i++)step();metrics();};
reset();function frame(now){requestAnimationFrame(frame);if(running){const count=Math.min(6,Math.max(1,Math.round((now-previous)/1000*60)));for(let i=0;i<count;i++)step();}previous=now;world.render();metrics();}requestAnimationFrame(frame);
</script></html>
