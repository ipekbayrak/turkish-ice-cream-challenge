<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kültür nesneleri — geliştirme</title>
<style>body{margin:0;color:#fff;background:#1e0e07;font:12px system-ui}canvas{position:fixed;inset:0}aside{position:fixed;bottom:12px;left:12px;right:12px;background:#1e140cf2;border-radius:10px;padding:10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}button,select{font:inherit;padding:8px;max-width:100%}output{width:100%;white-space:pre-wrap}</style>
<canvas></canvas><aside><select id="venue" aria-label="Mekân"></select><select id="shelf" aria-label="Raf"><option value="0">Sol raf</option><option value="1">Sağ raf</option><option value="2">Üst raf</option></select><select id="object" aria-label="Nesne"></select><button id="inspect">İncele</button><button id="return">Rafa bırak</button><button id="exit">Oyuna dön</button><button id="enter">Keşfet</button><output id="metrics"></output></aside>
<script type="module">
import {GameWorld} from '/src/world.js';import {VENUES} from '/src/venues.js';import {detailsForVenue} from '/src/cultural-details.js';
const world=new GameWorld(document.querySelector('canvas'));world.updateIceCreamScoops(0,false);let previous=performance.now();const $=id=>document.getElementById(id);
for(const venue of VENUES){const option=document.createElement('option');option.value=venue.id;option.textContent=venue.name.tr;$('venue').append(option);}
function shelf(){world.setExplorationSection?.(Number($('shelf').value));$('object').replaceChildren();for(const item of detailsForVenue($('venue').value).filter(item=>item.section===Number($('shelf').value))){const option=document.createElement('option');option.value=item.id;option.textContent=item.name.tr;$('object').append(option);}}
function venue(){world.setVenue(VENUES.find(v=>v.id===$('venue').value));world.setExplorationMode?.(true);shelf();}
$('venue').onchange=venue;$('shelf').onchange=shelf;$('inspect').onclick=()=>world.focusDiscovery?.($('object').value);$('return').onclick=()=>world.clearDiscoveryFocus?.();$('exit').onclick=()=>world.resetExploration?.();$('enter').onclick=()=>{world.setExplorationMode?.(true);shelf();};venue();
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.04,(now-previous)/1000);previous=now;world.updateEnvironmentAnimations(now/1000,dt,0,0,null,0);world.render();const targets=world.getDiscoveryTargets?.()||[];$('metrics').textContent=`${$('object').selectedOptions[0]?.textContent||''} · ${targets.filter(t=>t.visible).length}/6 görünür hedef\n${world.culturalScene?.focus ? (world.culturalScene.focus.age > .53 ? 'Nesne hazır' : 'Nesne hareket ediyor') : (world.culturalScene?.cameraTransition > .9 ? 'Raf hazır' : 'Kamera hareket ediyor')} · ${world.renderer.info.render.calls} çizim · ${world.renderer.info.memory.geometries} geometri · ${world.renderer.info.memory.textures} doku · kamera ${world.camera.fov.toFixed(1)}°`;}
requestAnimationFrame(frame);
</script></html>
