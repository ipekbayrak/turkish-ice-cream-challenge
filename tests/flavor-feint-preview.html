<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Renk şakası — animasyon kontrolü</title>
<style>[hidden]{display:none!important}body{margin:0;background:#201309;color:#fff;font:12px system-ui}canvas{position:fixed;inset:0}section{position:fixed;bottom:0;left:0;right:0;padding:8px;background:#21170fe8;display:flex;gap:5px;flex-wrap:wrap}button,select{padding:8px;font:inherit}output{width:100%;white-space:pre-wrap;font-size:11px}</style>
<canvas></canvas><section><label>Top <select id="count"><option>1</option><option>2</option><option>5</option><option>8</option></select></label><button id="play">Oynat</button><button id="wrong">Yanlış renk</button><button id="refuse">İstemiyorum ↔</button><button id="return">Kovaya dönüş</button><button id="right">İstenen renk</button><button id="final">Servis</button><button id="hide">Gizle</button><output></output></section>
<script type="module">
import{GameWorld}from'/src/world.js';import{TrickDirector}from'/src/tricks.js';import{SoundEngine}from'/src/audio.js';import{EncounterCamera}from'/src/encounter-camera.js';import{createFlavorFeintPlan,FLAVOR_FEINT_ID}from'/src/flavor-feint-plan.js';
const world=new GameWorld(document.querySelector('canvas')),sound=new SoundEngine();sound.setMuted(true);
const save={lang:'tr',data:{unlockedStage:31,preferredScoopCount:1,preferredFlavors:[0,0,0,0,0,0,0,0]},hapticsEnabled:false,t:key=>key,discoverTrick(){},recordStageResult(){},setOrderPreferences(){},getStageBestScore(){return 0;},getUstaName(){return'Usta';},getTrickInfo:id=>({name:id})};
const d=new TrickDirector(world,sound,save,{}),camera=new EncounterCamera(world);world.encounterCamera=camera;
const input={isPointerDown:false,isMoving:false,normX:0,normY:0,handWorldPos:world.touristHand.position.clone(),intentWorldPos:world.touristHand.position.clone(),pointerEpoch:0,cancelEpoch:0};
let running=false,time=0,last=performance.now(),plan;
function reset(){running=false;const n=Number(document.querySelector('select').value);world.resetTransientPresentation();d.setOrderConfig(n,Array(n).fill(0),31);d.resetRound(31,false);d.config={...d.config,speedMult:.78};world.setVendorCharacter(1);
 plan=createFlavorFeintPlan(Array(n).fill('SCRAPE_FLAVOR_SCOOP').concat('FINAL_PISTACHIO_CATCH'),d.selectedFlavors,n,{chance:1,random:()=>.01});plan.status='active';d.flavorFeint=plan;d.routine=[FLAVOR_FEINT_ID,'FINAL_PISTACHIO_CATCH'];d.scoopCount=n;world.updateIceCreamScoops(n,false);const display=d.selectedFlavors.slice();display[plan.index]=plan.offered;world.applySelectedFlavorColors(display);world.updateServingLayout(1);d.active=true;d._enterRoutineStep(0);camera.setPhase('play',true);time=0;
 for(let i=0;i<3;i++)tick(0);
}
function tick(dt){time+=dt;d.update(dt,time,input);world.updateTouristHand(input.handWorldPos,.15,0,dt,false,time);world.updateEnvironmentAnimations(time,dt,0,0,null,0);camera.update(dt);}
function seek(phase,age=0){reset();for(let i=0;i<2000;i++){if(phase===9&&d.currentMechanic!==FLAVOR_FEINT_ID)break;if(d.flavorFeintShow?.phase===phase&&d.flavorFeintShow.age>=age)break;tick(1/60);}world.render();}
document.querySelector('#count').onchange=reset;document.querySelector('#play').onclick=()=>{if(!d.flavorFeintShow)reset();running=true;};document.querySelector('#wrong').onclick=()=>seek(-1,.35);document.querySelector('#return').onclick=()=>seek(3,.4);document.querySelector('#refuse').onclick=()=>{reset();input.isPointerDown=true;input.pointerEpoch++;input.pointerY=700;for(const x of[160,150,135,120,130,145,160]){input.pointerX=x;input.normX=(x-160)*3/390;input.handWorldPos.x=.22+(x-160)*.0025;for(let i=0;i<3;i++)tick(1/60);}input.isPointerDown=false;for(let i=0;i<20;i++)tick(1/60);};
document.querySelector('#right').onclick=()=>seek(6,.4);document.querySelector('#final').onclick=()=>seek(9);document.querySelector('#hide').onclick=()=>document.querySelector('section').hidden=true;
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.04,(now-last)/1000);last=now;if(running){tick(dt);if(d.currentMechanic!==FLAVOR_FEINT_ID)running=false;}camera.update(0);world.render();document.querySelector('output').textContent=JSON.stringify({phase:d.flavorFeintShow?.phase??'final',status:plan?.status,rejected:!!plan?.rejected,reaction:world._vendorReaction?.kind,ordered:plan?.requested,tease:plan?.offered,visibleColors:world.scoopMeshes.filter(m=>m.visible).map(m=>m.material.color.getHex().toString(16)),carry:world.carryScoop.visible?world.carryScoop.material.color.getHex().toString(16):null,owner:world.conePivot.parent===world.paddleGroup?'pole':'vendor',score:d.score});}
reset();requestAnimationFrame(frame);
</script></html>
