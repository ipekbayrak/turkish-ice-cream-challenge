<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="38%" r="72%">
      <stop offset="0%" stop-color="#4a160c"/>
      <stop offset="60%" stop-color="#210905"/>
      <stop offset="100%" stop-color="#0e0302"/>
    </radialGradient>
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0a6"/>
      <stop offset="45%" stop-color="#f5b942"/>
      <stop offset="100%" stop-color="#a8680c"/>
    </linearGradient>
    <linearGradient id="coneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ebb067"/>
      <stop offset="100%" stop-color="#9c5416"/>
    </linearGradient>
    <linearGradient id="fezGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cc1626"/>
      <stop offset="100%" stop-color="#6e0710"/>
    </linearGradient>
  </defs>

  <!-- Rich Grand Bazaar Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Ornate Ottoman Gold Medallion Frame -->
  <circle cx="256" cy="256" r="222" fill="#3d080c" stroke="url(#goldRing)" stroke-width="14"/>
  <circle cx="256" cy="256" r="200" fill="none" stroke="#f5b942" stroke-width="3" stroke-dasharray="12 10" opacity="0.6"/>

  <!-- Hanging Brass Bells -->
  <g fill="url(#goldRing)" stroke="#754605" stroke-width="3">
    <path d="M108,112 Q122,88 136,112 L142,130 L102,130 Z"/>
    <circle cx="122" cy="135" r="6" fill="#ffe07d"/>
    <path d="M376,112 Q390,88 404,112 L410,130 L370,130 Z"/>
    <circle cx="390" cy="135" r="6" fill="#ffe07d"/>
  </g>

  <!-- Iron Maraş Paddle (Diagonal behind cone) -->
  <g transform="rotate(-26 256 256)">
    <rect x="246" y="36" width="20" height="404" rx="10" fill="#d8e0eb" stroke="#4f5969" stroke-width="5"/>
    <ellipse cx="256" cy="404" rx="34" ry="20" fill="#e6edf5" stroke="#4f5969" stroke-width="5"/>
  </g>

  <!-- Crispy Waffle Cone -->
  <polygon points="180,272 332,272 256,456" fill="url(#coneGrad)" stroke="#633209" stroke-width="8" stroke-linejoin="round"/>
  <!-- Waffle Grid Lines -->
  <line x1="202" y1="272" x2="274" y2="412" stroke="#783d0d" stroke-width="5" opacity="0.65"/>
  <line x1="244" y1="272" x2="292" y2="366" stroke="#783d0d" stroke-width="5" opacity="0.65"/>
  <line x1="310" y1="272" x2="238" y2="412" stroke="#783d0d" stroke-width="5" opacity="0.65"/>
  <line x1="268" y1="272" x2="220" y2="366" stroke="#783d0d" stroke-width="5" opacity="0.65"/>

  <!-- Scoop 1: Maraş Vanilla (Creamy Stretchy Base) -->
  <circle cx="256" cy="248" r="66" fill="#fff9ed" stroke="#decba4" stroke-width="6"/>

  <!-- Scoop 2: Antep Pistachio Green -->
  <circle cx="206" cy="196" r="52" fill="#70cf4c" stroke="#3c8a22" stroke-width="6"/>

  <!-- Scoop 3: Dark Chocolate -->
  <circle cx="306" cy="196" r="52" fill="#592812" stroke="#331406" stroke-width="6"/>

  <!-- Scoop 4: Wild Berry (Karadut) Crown Scoop -->
  <circle cx="256" cy="154" r="50" fill="#cf174c" stroke="#7a0a2a" stroke-width="6"/>

  <!-- Antep Pistachio Crumble Topping -->
  <g fill="#7ee856" stroke="#2c6b15" stroke-width="2">
    <circle cx="238" cy="126" r="7"/>
    <circle cx="256" cy="120" r="8"/>
    <circle cx="274" cy="126" r="7"/>
    <circle cx="247" cy="134" r="6"/>
    <circle cx="266" cy="134" r="6"/>
  </g>

  <!-- Top Crown: Traditional Crimson Fez with Gold Tassel -->
  <polygon points="214,114 298,114 284,54 228,54" fill="url(#fezGrad)" stroke="#f5b942" stroke-width="5" stroke-linejoin="round"/>
  <path d="M256,54 Q306,58 314,110" fill="none" stroke="#f5b942" stroke-width="8" stroke-linecap="round"/>
  <circle cx="256" cy="54" r="9" fill="#ffe07d"/>

  <!-- Iconic Pala Mustache Accent -->
  <path d="M256,252 C224,238 184,264 164,242 C180,278 228,274 256,262 C284,274 332,278 348,242 C328,264 288,238 256,252 Z" fill="#211009" stroke="#f5b942" stroke-width="3.5"/>
</svg>
